# Copy to config.yaml (git-ignored) and edit, or just use the web UI (`jolai ui`),
# which reads and writes this file for you.
resume: resume.pdf

preferences:
  # Roles you want. Used to score "want" and as search terms for Remotive.
  titles: ["Customer Success Manager", "Operations Coordinator", "Project Coordinator"]
  locations: ["London"]   # substring match against the posting's location
  remote: true            # remote roles count as a location match
  remote_only: false      # drop everything that isn't remote
  keywords: ["education", "healthcare"]   # topics you'd enjoy; boosts matching jobs
  min_salary: null        # e.g. 40000; only used when a posting lists pay

  # Hard filters: jobs that break these are dropped before scoring.
  english_only: true      # drop jobs that require another language ("a plus" is OK)
  languages_spoken: []    # other languages you speak, e.g. [Hindi]; jobs requiring them stay
  work_permits: []        # countries you can already work in, e.g. [India, Hong Kong]
  open_to_sponsorship: true          # keep jobs elsewhere unless they say they won't sponsor
  hide_unclear_sponsorship: false    # true = elsewhere only if the posting says it sponsors
  max_technical: low      # low = not technical, medium = a little, any = no limit
  max_years: 3            # drop jobs asking for more years of experience than this
  max_level: mid          # drop titles above this: entry, mid, senior (or leave out)
  exclude_title_keywords: ["intern", "sales"]
  exclude_keywords: []    # drop postings mentioning any of these
  exclude_companies: []

  # Fix-ups if `jolai profile` misreads your resume:
  extra_skills: []          # e.g. ["Zendesk", "Excel"]
  # years_experience: 3

weights:
  # 1.0 = rank purely by how likely you are to get the job,
  # 0.0 = rank purely by how well it matches your preferences.
  chance_vs_want: 0.6

sources:
  # Aggregators (free, no setup)
  remotive: true            # remote jobs across many fields, including non-technical
  remoteok: true
  hackernews: false         # "Ask HN: Who is hiring?": mostly software jobs
  # Company job boards. The name is the last part of the company's careers URL:
  #   boards.greenhouse.io/<name>   jobs.lever.co/<name>   jobs.ashbyhq.com/<name>
  greenhouse: []
  lever: []
  ashby: []
  # Any careers page that publishes schema.org JobPosting data (most do, for Google Jobs).
  career_pages: []
  # search_terms: ["customer success", "operations"]   # defaults to your titles (up to 6)

llm:
  # Optional AI double-check of your top matches. Off unless you click the button in the UI
  # or pass --llm. Answers are cached in results/ai_cache.json, so each job is paid for once.
  enabled: false
  model: claude-opus-5-5    # see README "Cost" for cheaper options
  effort: low               # low keeps the answer short and cheap
  top_n: 10                 # how many of your top matches to check

output:
  top: 25
  dir: results
